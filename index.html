<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Purity Screen — Privacy Policy</title>
</head>
<body>
<script>
  const lang = navigator.language.slice(0, 2);

  if (lang === 'ru') {
    window.location.replace('privacy_policy_ru.html');
  } else if (lang === 'be') {
    window.location.replace('privacy_policy_be.html');
  } else {
    window.location.replace('privacy_policy_en.html');
  }
</script>
</body>
</html>
